<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Celda Industrial - A-Frame</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Entorno y Piso -->
    <a-sky color="#1A1A2E"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#333333"></a-plane>

    <!-- Agrupamiento de la Celda Industrial -->
    <a-entity id="celda-manufactura" position="0 0 -4">
      
      <!-- Chasis y Cinta de la Banda Transportadora (a-box) -->
      <a-box position="0 0.5 0" width="4" height="0.2" depth="1" color="#555555"></a-box>
      <a-box position="-1.8 0.25 0.4" width="0.1" height="0.5" depth="0.1" color="#222222"></a-box>
      <a-box position="1.8 0.25 0.4" width="0.1" height="0.5" depth="0.1" color="#222222"></a-box>
      <a-box position="-1.8 0.25 -0.4" width="0.1" height="0.5" depth="0.1" color="#222222"></a-box>
      <a-box position="1.8 0.25 -0.4" width="0.1" height="0.5" depth="0.1" color="#222222"></a-box>

      <!-- Tanque de Almacenamiento (a-cylinder) -->
      <a-cylinder position="-2 1.5 -1" radius="0.6" height="2" color="#0077B6"></a-cylinder>

      <!-- Indicadores / Sensores (a-sphere) -->
      <a-sphere position="-2 2.6 -1" radius="0.15" color="#00FF00"></a-sphere>
      <a-sphere position="0 0.7 0" radius="0.1" color="#FF0000"></a-sphere>

    </a-entity>
  </a-scene>
</body>
</html>
